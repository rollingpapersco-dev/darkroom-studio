<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#000;color:#f5f5f7;font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:24px}a{color:#f5f5f7;text-decoration:none}a:hover{color:#fff}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding:10px">
 <div><div style="height:100px;border-radius:18px;background:#0c0c0e;border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow-float)"></div><div style="font-size:11px;color:#86868b;margin-top:10px;font-family:ui-monospace,monospace">--shadow-float<br>0 30px 80px rgba(0,0,0,.65)</div></div>
 <div><div style="position:relative;height:100px;border-radius:12px;overflow:hidden;background:url(../assets/episodes/ep05.jpg) center/cover"><div style="position:absolute;left:0;right:0;top:0;height:44px;background:rgba(0,0,0,.6);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-bottom:1px solid #1c1c1e"></div></div><div style="font-size:11px;color:#86868b;margin-top:10px;font-family:ui-monospace,monospace">nav · rgba(0,0,0,.6)<br>blur(30px)</div></div>
 <div><div style="position:relative;height:100px;border-radius:12px;overflow:hidden;background:url(../assets/episodes/ep09.jpg) center/cover"><span style="position:absolute;top:14px;left:14px;font-size:10px;font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.85);background:rgba(0,0,0,.45);backdrop-filter:blur(8px);padding:4px 10px;border-radius:12px">EP.09</span></div><div style="font-size:11px;color:#86868b;margin-top:10px;font-family:ui-monospace,monospace">chip · rgba(0,0,0,.45)<br>blur(8px)</div></div></div></body></html>
