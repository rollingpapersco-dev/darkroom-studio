<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#000;color:#f5f5f7;font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:24px}a{color:#f5f5f7;text-decoration:none}a:hover{color:#fff}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px"><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div style="height:64px;border-radius:12px;background:var(--dr-red);"></div><div style="font-size:12px;font-weight:600;color:#fff">Darkroom red</div><div style="font-size:11px;color:#86868b;font-family:ui-monospace,monospace">--dr-red<br>#C8362A</div></div><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div style="height:64px;border-radius:12px;background:var(--dr-red-tint);border:1px solid #2c2c2e"></div><div style="font-size:12px;font-weight:600;color:#fff">Red tint</div><div style="font-size:11px;color:#86868b;font-family:ui-monospace,monospace">--dr-red-tint<br>rgba(200,54,42,.08)</div></div><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div style="height:64px;border-radius:12px;background:var(--dr-error);"></div><div style="font-size:12px;font-weight:600;color:#fff">Error</div><div style="font-size:11px;color:#86868b;font-family:ui-monospace,monospace">--dr-error<br>#ff453a</div></div><div></div></div></body></html>
