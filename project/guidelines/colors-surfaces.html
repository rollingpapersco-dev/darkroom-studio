<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#000;color:#f5f5f7;font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:24px}a{color:#f5f5f7;text-decoration:none}a:hover{color:#fff}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px"><div><div style="height:96px;border-radius:20px;background:var(--surface-glass);border:1px solid var(--border-glass)"></div><div style="font-size:12px;font-weight:600;margin-top:8px">Glass</div><div style="font-size:11px;color:#86868b;font-family:ui-monospace,monospace">--surface-glass</div></div><div><div style="height:96px;border-radius:20px;background:var(--surface-glass-gradient);border:1px solid var(--border-glass)"></div><div style="font-size:12px;font-weight:600;margin-top:8px">Glass gradient</div><div style="font-size:11px;color:#86868b;font-family:ui-monospace,monospace">--surface-glass-gradient</div></div><div><div style="height:96px;border-radius:20px;background:var(--surface-card);border:1px solid var(--border-main)"></div><div style="font-size:12px;font-weight:600;margin-top:8px">Card</div><div style="font-size:11px;color:#86868b;font-family:ui-monospace,monospace">--surface-card</div></div><div><div style="height:96px;border-radius:20px;background:var(--surface-card-raised);border:1px solid #fff"></div><div style="font-size:12px;font-weight:600;margin-top:8px">Featured</div><div style="font-size:11px;color:#86868b;font-family:ui-monospace,monospace">--surface-card-raised</div></div></div></body></html>
