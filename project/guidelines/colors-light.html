<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#000;color:#f5f5f7;font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:24px}a{color:#f5f5f7;text-decoration:none}a:hover{color:#fff}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px"><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div style="height:64px;border-radius:12px;background:var(--dr-gray-500);"></div><div style="font-size:12px;font-weight:600;color:#fff">Label grey</div><div style="font-size:11px;color:#86868b;font-family:ui-monospace,monospace">--dr-gray-500<br>#86868b</div></div><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div style="height:64px;border-radius:12px;background:var(--dr-gray-100);"></div><div style="font-size:12px;font-weight:600;color:#fff">List</div><div style="font-size:11px;color:#86868b;font-family:ui-monospace,monospace">--dr-gray-100<br>#e5e5ea</div></div><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div style="height:64px;border-radius:12px;background:var(--dr-white-soft);"></div><div style="font-size:12px;font-weight:600;color:#fff">Body</div><div style="font-size:11px;color:#86868b;font-family:ui-monospace,monospace">--dr-white-soft<br>#f5f5f7</div></div><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div style="height:64px;border-radius:12px;background:var(--dr-white);"></div><div style="font-size:12px;font-weight:600;color:#fff">Pure</div><div style="font-size:11px;color:#86868b;font-family:ui-monospace,monospace">--dr-white<br>#ffffff</div></div></div></body></html>
