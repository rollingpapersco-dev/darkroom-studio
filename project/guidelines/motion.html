<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#000;color:#f5f5f7;font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:24px}a{color:#f5f5f7;text-decoration:none}a:hover{color:#fff}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;font-size:12px"><div style="border:1px solid #1c1c1e;border-radius:12px;padding:12px"><div style="font-weight:700;color:#fff">0.2s</div><div style="color:#f5f5f7;margin:4px 0">Links, pills, buttons</div><div style="color:#86868b">opacity .8→1, scale(1.03)</div></div><div style="border:1px solid #1c1c1e;border-radius:12px;padding:12px"><div style="font-weight:700;color:#fff">0.3s ease</div><div style="color:#f5f5f7;margin:4px 0">Cards</div><div style="color:#86868b">translateY(-4px), border .08→.2</div></div><div style="border:1px solid #1c1c1e;border-radius:12px;padding:12px"><div style="font-weight:700;color:#fff">0.35s ease</div><div style="color:#f5f5f7;margin:4px 0">Carousel "Watch"</div><div style="color:#86868b">fade + 6px rise</div></div><div style="border:1px solid #1c1c1e;border-radius:12px;padding:12px"><div style="font-weight:700;color:#fff">0.6s ease</div><div style="color:#f5f5f7;margin:4px 0">Video preview</div><div style="color:#86868b">crossfade in</div></div></div></body></html>
